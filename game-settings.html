<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>小世界 · 常驻向导配置</title><style>*{box-sizing:border-box}body{font:15px/1.8 system-ui;background:#f4f4ed;color:#2d4435;margin:0}main{max-width:950px;margin:35px auto;padding:0 24px}section{padding:25px;background:#fffef9;border:1px solid #dce3d3;border-radius:14px;margin:20px 0}h1{font-size:26px}label{display:block;margin:12px 0}input,textarea,button{font:inherit;padding:10px;border:1px solid #c9d6c1;border-radius:7px}input,textarea{width:100%}textarea{font-size:13px}button{background:#355f46;color:white;cursor:pointer}a{color:#355f46}small{color:#78856c}.row{display:grid;grid-template-columns:1fr 1fr;gap:20px}</style></head><body><main><a href="/home-creation-settings.html">← 制作配置</a><h1>常驻向导配置</h1><p>本机管理页面。对话模型沿用制作配置中的 Agent 接口和模型；此处单独设置陪伴提示词、对话预算和提醒频率。日常提示由游戏事件触发，不调用模型。</p><form id="form"><section><label>向导名字<input id="name" maxlength="20" required></label><label>陪伴、玩法说明、记忆与布局工具提示词<textarea id="prompt" rows="20" required></textarea></label></section><section><div class="row"><label>每日对话预算上限（估算人民币）<input id="dailyCnyCap" type="number" min="0" max="100" step=".1" required></label><label>每次对话预留（估算人民币）<input id="turnReserveCny" type="number" min=".001" max="2" step=".001" required></label></div><div class="row"><label>普通提醒间隔（秒）<input id="reminderCooldownSeconds" type="number" min="60" max="3600" required></label><label>每次游玩最多普通提醒次数<input id="maxOrdinaryReminders" type="number" min="0" max="8" required></label></div><small>制作进度和关键奖励消息不计入普通提醒。离线不主动开启新创作。</small></section><button>保存配置</button><span id="result" role="status"></span></form></main><script>
const keys=['name','prompt','dailyCnyCap','turnReserveCny','reminderCooldownSeconds','maxOrdinaryReminders'];let config;
async function load(){const r=await fetch('/api/game-v1/settings');config=await r.json();for(const k of keys)document.getElementById(k).value=config[k];}
document.getElementById('form').onsubmit=async e=>{e.preventDefault();const value={};for(const k of keys)value[k]=['name','prompt'].includes(k)?document.getElementById(k).value:Number(document.getElementById(k).value);const r=await fetch('/api/game-v1/settings',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(value)});const data=await r.json();document.getElementById('result').textContent=r.ok?' 已保存；新对话使用新规则，重新打开聊天同步显示设置。':data.error?.message||'保存失败';};load();
</script></body></html>
