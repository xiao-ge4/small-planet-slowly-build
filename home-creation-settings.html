<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>家园共创 · 创作配置</title><style>
*{box-sizing:border-box}body{font:15px/1.7 system-ui,-apple-system,"PingFang SC",sans-serif;background:#f4f4ec;color:#293e32;margin:0}main{max-width:1000px;margin:30px auto;padding:0 22px}header{display:flex;align-items:center;gap:15px}h1{font-size:25px}a{color:#315f49}section{background:#fffef9;border:1px solid #d8dfcf;border-radius:14px;margin:20px 0;padding:22px}h2{font-size:18px;margin:0 0 14px}label{display:block;font-size:14px;margin:15px 0 7px}input,textarea,button{font:inherit;border:1px solid #ccd6c3;border-radius:8px;padding:10px}input,textarea{width:100%;background:white;color:inherit}textarea{resize:vertical;font-size:13px;line-height:1.6}button{background:#315f49;color:white;cursor:pointer}button:disabled{opacity:.5}.row{display:grid;grid-template-columns:1fr 1fr;gap:20px}.muted{font-size:13px;color:#72816a}.sticky{position:sticky;bottom:0;padding:15px;background:#f4f4ecee;border-top:1px solid #d8dfcf;display:flex;gap:16px;align-items:center}#message{font-size:14px}@media(max-width:650px){.row{grid-template-columns:1fr}}
</style></head><body><main><header><a href="/">← 返回创作台</a><h1>创作配置</h1><a href="/game-settings.html">常驻向导配置 →</a></header><p class="muted">仅供本机开发管理。修改应用于新创作任务，进行中的任务继续使用创建时的配置快照。正式上线前需接入管理员身份校验。密钥由服务端配置文件读取。</p><form id="settings"><section><h2>规划与视觉检查 Agent</h2><div class="row"><div><label>模型</label><input id="model" required></div><div><label>每张图最多自动修正次数（0–5）</label><input id="maxCorrections" type="number" min="0" max="5" required></div></div><label>API 地址（HTTPS，不含密钥）</label><input id="apiUrl" type="url" required><div class="row"><div><label>请求超时（秒）</label><input id="timeoutSeconds" type="number" min="15" max="300" required></div><div><label>每次 Agent 请求预留预算（¥）</label><input id="agentReserveCny" type="number" min=".001" max="10" step=".001" required></div></div><div class="row"><div><label>输入估价（¥ / 百万 Token）</label><input id="inputCnyPerMillion" type="number" min="0" max="1000" step=".01" required></div><div><label>输出估价（¥ / 百万 Token）</label><input id="outputCnyPerMillion" type="number" min="0" max="1000" step=".01" required></div></div><label>Agent 总规则</label><textarea id="instruction" rows="9" required></textarea><label>图像修正共用规则</label><textarea id="repairInstruction" rows="3" required></textarea></section>
<section><h2>每步提示词</h2><label>统一美术风格</label><textarea id="style" rows="4" required></textarea><label>需求整理与概念图规划</label><textarea id="briefPrompt" rows="8" required></textarea><label>资产拆解</label><textarea id="planPrompt" rows="8" required></textarea><label>单件三视图（保留 {name} 与 {description} 占位符）</label><textarea id="assetSheetPrompt" rows="6" required></textarea><label>布局规划（只允许目录资产与结构化坐标）</label><textarea id="layoutPrompt" rows="7" required></textarea><label>Unity 实际画面检查（沿用 Agent 修改次数上限）</label><textarea id="visualReviewPrompt" rows="10" required></textarea><label>图像检查与修正决策</label><textarea id="reviewPrompt" rows="9" required></textarea></section>
<section><h2>图像与建模服务</h2><p>生图：gpt-image-2 · 默认每次 1 张<br>建模：Aholo 标准 G1 · 300000 面 · PBR · GLB</p><label>每次生图预留预算（USD）</label><input id="imageReserveUsd" type="number" min=".001" max="10" step=".001" required><p class="muted">预留不是平台的封顶报价。实际金额按回报结算；如累计回报超出预算，将阻止后续提交。群核积分未知时须由玩家明确授权模型数量。</p></section><div class="sticky"><button type="submit" id="save">保存并用于新任务</button><span id="message" role="status"></span></div></form></main><script>
let config;const $=id=>document.getElementById(id);const agentKeys=['model','apiUrl','maxCorrections','timeoutSeconds','inputCnyPerMillion','outputCnyPerMillion','instruction','repairInstruction'];const keys=['visualReviewPrompt','style','briefPrompt','planPrompt','reviewPrompt','assetSheetPrompt','layoutPrompt','agentReserveCny','imageReserveUsd'];
async function load(){const r=await fetch('/api/home-creation/settings');if(!r.ok)throw Error('无法读取配置');config=await r.json();agentKeys.forEach(k=>$(k).value=config.agent[k]);keys.forEach(k=>$(k).value=config[k]);}
$('settings').onsubmit=async e=>{e.preventDefault();$('save').disabled=true;try{const updated=structuredClone(config);for(const k of agentKeys)updated.agent[k]=['maxCorrections','timeoutSeconds','inputCnyPerMillion','outputCnyPerMillion'].includes(k)?Number($(k).value):$(k).value;for(const k of keys)updated[k]=['agentReserveCny','imageReserveUsd'].includes(k)?Number($(k).value):$(k).value;const r=await fetch('/api/home-creation/settings',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(updated)});const d=await r.json();if(!r.ok)throw Error(d.error?.message||'保存失败');config=d;$('message').textContent='已保存，新任务将使用此配置。';}catch(e){$('message').textContent=e.message;}finally{$('save').disabled=false;}};load().catch(e=>$('message').textContent=e.message);
</script></body></html>
